<!DOCTYPE html>

<head>

    <title>Act‑O‑Matic — Meenit Playground</title>

<body class="act-o-matic-game">

        <header class="screen-header">
            <h1 class="game-title-main">Act‑O‑Matic</h1>

        <footer class="footer">
