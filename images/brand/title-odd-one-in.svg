<svg xmlns="http://www.w3.org/2000/svg" class="pg-title pg-title-ooi" viewBox="0 0 60 15" width="60" height="15" role="img" aria-labelledby="pg-title-ooi-t"><title id="pg-title-ooi-t">Odd One In</title><desc>Odd One In title in pixel letters; one gold letter sits tilted and oversized, the odd one.</desc><style>.pg-title-ooi{color:#e9e4cf;--t-accent-default:#d4b84a;--t-shade-default:#2a3314}@media (prefers-color-scheme:light){.pg-title-ooi{color:#2e3a14;--t-accent-default:#b8981c;--t-shade-default:#c9cfa8}}
.pg-title-ooi .pg-title-ooi-l{transform-box:fill-box;transform-origin:50% 100%;animation:pg-title-ooi-fall .45s cubic-bezier(.2,1.5,.5,1) both;animation-delay:calc(var(--i)*55ms)}
.pg-title-ooi .pg-title-ooi-odd{animation-name:pg-title-ooi-fallodd;animation-duration:.6s;animation-delay:.6s}
.pg-title-ooi .pg-title-ooi-wob{transform-box:fill-box;transform-origin:50% 90%;transform:rotate(-10deg);animation:pg-title-ooi-wob 4s ease-in-out 1.6s infinite}
@keyframes pg-title-ooi-fall{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pg-title-ooi-fallodd{0%{opacity:0;transform:translateY(-9px) scale(1.3)}70%{transform:translateY(.6px) scale(1.18)}100%{opacity:1;transform:translateY(0) scale(1.18)}}
@keyframes pg-title-ooi-wob{0%,100%{transform:rotate(-10deg)}6%{transform:rotate(8deg)}12%{transform:rotate(-12deg)}18%{transform:rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){.pg-title-ooi *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pg-title-ooi .pg-title-ooi-odd{transform:scale(1.18)}}
