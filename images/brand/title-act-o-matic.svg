<svg xmlns="http://www.w3.org/2000/svg" class="pg-title pg-title-aom" viewBox="0 0 68 18" width="68" height="18" role="img" aria-labelledby="pg-title-aom-t"><title id="pg-title-aom-t">Act-O-Matic</title><desc>Act-O-Matic title in gold pixel letters that spin into place like slot reels inside a marquee frame.</desc><style>.pg-title-aom{color:#f0c040;--t-accent-default:#d4a017;--t-shade-default:#5a3d05}@media (prefers-color-scheme:light){.pg-title-aom{color:#8a5f00;--t-accent-default:#b8860b;--t-shade-default:#f3dfa1}}
.pg-title-aom .pg-title-aom-reel{animation:pg-title-aom-spin .9s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*50ms)}
.pg-title-aom .pg-title-aom-dash{animation:pg-title-aom-fade .4s ease-out .9s both}
.pg-title-aom .pg-title-aom-bulb{opacity:.35;animation:pg-title-aom-bulb 1.8s steps(1) infinite;animation-delay:calc(var(--p)*-.6s + 1.1s)}
@keyframes pg-title-aom-spin{0%{transform:translateY(27px)}100%{transform:translateY(0)}}
@keyframes pg-title-aom-fade{0%{opacity:0}100%{opacity:1}}
@keyframes pg-title-aom-bulb{0%{opacity:1}33%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pg-title-aom *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pg-title-aom .pg-title-aom-bulb{opacity:1}}
