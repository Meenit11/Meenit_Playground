<svg xmlns="http://www.w3.org/2000/svg" class="pg-title pg-title-mafia" viewBox="0 0 36 18.2" width="36" height="18.2" role="img" aria-labelledby="pg-title-mafia-t"><title id="pg-title-mafia-t">Mafia</title><desc>Mafia title in tall wine-red pixel letters between bronze rules, revealed through blinds with a red glint.</desc><style>.pg-title-mafia{color:#8b3a4a;--t-accent-default:#c9a86c;--t-shade-default:#0a080c}@media (prefers-color-scheme:light){.pg-title-mafia{color:#6e2d3a;--t-accent-default:#8a6a2e;--t-shade-default:#2a1016}}
.pg-title-mafia .pg-title-mafia-bar{transform-box:fill-box;transform-origin:50% 50%;animation:pg-title-mafia-open .55s cubic-bezier(.2,0,0,1) both;animation-delay:calc(var(--k)*70ms)}
.pg-title-mafia .pg-title-mafia-rule{animation:pg-title-mafia-fade .6s ease-out .5s both}
.pg-title-mafia .pg-title-mafia-glint{animation:pg-title-mafia-glint 6s cubic-bezier(.5,0,.3,1) .9s infinite}
@keyframes pg-title-mafia-open{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pg-title-mafia-fade{0%{opacity:0}100%{opacity:1}}
@keyframes pg-title-mafia-glint{0%{transform:skewX(-25deg) translateX(0)}14%,100%{transform:skewX(-25deg) translateX(52px)}}
@media (prefers-reduced-motion:reduce){.pg-title-mafia *{animation:none!important}}
