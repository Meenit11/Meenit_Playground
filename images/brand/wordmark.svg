<svg xmlns="http://www.w3.org/2000/svg" class="pg-wordmark" viewBox="0 0 64 36" width="64" height="36" role="img" aria-labelledby="pg-wordmark-t"><title id="pg-wordmark-t">Meenit's Playground</title><desc>Pixel wordmark: a haloed grinning face above the words Meenit's Playground.</desc><style>.pg-wordmark{color:#f4efe4}@media (prefers-color-scheme:light){.pg-wordmark{color:#1b1a2e}}
.pg-wordmark .pg-wordmark-mark{transform-box:fill-box;transform-origin:50% 100%;animation:pg-wordmark-pop .55s cubic-bezier(.34,1.56,.64,1) both}
.pg-wordmark .pg-wordmark-l{transform-box:fill-box;transform-origin:50% 100%;animation:pg-wordmark-rise .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.28s + var(--i)*45ms)}
.pg-wordmark .pg-wordmark-big{animation-name:pg-wordmark-pop;animation-duration:.5s;animation-delay:calc(.42s + var(--i)*55ms)}
.pg-wordmark .pg-wordmark-halo{animation:pg-wordmark-float 3.4s ease-in-out 1.3s infinite}
.pg-wordmark .pg-wordmark-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:pg-wordmark-blink 5.5s ease-in-out 2s infinite}
.pg-wordmark .pg-wordmark-glint{animation:pg-wordmark-glint 7s cubic-bezier(.4,0,.2,1) 1.05s infinite}
@keyframes pg-wordmark-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes pg-wordmark-rise{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pg-wordmark-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}
@keyframes pg-wordmark-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes pg-wordmark-glint{0%{transform:skewX(-20deg) translateX(0)}18%,100%{transform:skewX(-20deg) translateX(92px)}}
@media (prefers-reduced-motion:reduce){.pg-wordmark *{animation:none!important}}
