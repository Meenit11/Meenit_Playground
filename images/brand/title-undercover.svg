<svg xmlns="http://www.w3.org/2000/svg" class="pg-title pg-title-undercover" viewBox="0 0 66 14" width="66" height="14" role="img" aria-labelledby="pg-title-undercover-t"><title id="pg-title-undercover-t">Undercover</title><desc>Undercover title in pixel letters, revealed as violet redaction bars slide away.</desc><style>.pg-title-undercover{color:#e8e4dc;--t-accent-default:#8b5cf6;--t-shade-default:#4c1d95}@media (prefers-color-scheme:light){.pg-title-undercover{color:#2a1f4a;--t-accent-default:#6d28d9;--t-shade-default:#c4b5fd}}
.pg-title-undercover .pg-title-undercover-bar{animation:pg-title-undercover-slide .5s cubic-bezier(.4,0,.2,1) both;animation-delay:calc(.35s + var(--k)*140ms)}
.pg-title-undercover .pg-title-undercover-sweep{animation:pg-title-undercover-sweep 7s cubic-bezier(.4,0,.2,1) 2.4s infinite}
.pg-title-undercover .pg-title-undercover-rule{transform-box:fill-box;transform-origin:0 50%;animation:pg-title-undercover-grow .5s ease-out .2s both}
@keyframes pg-title-undercover-slide{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(14px)}}
@keyframes pg-title-undercover-sweep{0%,100%{transform:translateX(0)}8%{transform:translateX(30.6px)}16%{transform:translateX(30.6px)}24%{transform:translateX(61.2px)}25%{transform:translateX(0)}}
@keyframes pg-title-undercover-grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.pg-title-undercover *{animation:none!important}}
@media (prefers-reduced-motion:reduce){.pg-title-undercover .pg-title-undercover-bar{opacity:0}}
